#
# What the rccl C header cannot express, beyond the defaults the generator
# derives from it: one table per C function, and a key with braces names
# several. A _64 or _spt variant without a table takes its base's. See "Fixing a
# binding" in the generator README; `gen.sh --explain <function>` shows what
# applies.

format = 1

# ncclCommInitAll creates one communicator per device: comm points to ndev handles.
[ncclCommInitAll]
comm = "handle-array"

# Queries that write one value on the host, which the defaults take for an array.
[ncclCommCount]
count = "scalar-host"

[ncclCommCuDevice]
device = "scalar-host"

[ncclCommUserRank]
rank = "scalar-host"

[ncclCommMemStats]
value = "scalar-host"

[ncclRedOpCreatePreMulSum]
op = "scalar-host"

[ncclParamGet]
len = "scalar-host"
